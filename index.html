    <!--
      v10: ฉากเข้าเว็บด้วยภาพวิทยาลัย (intro.js + campus-gl.js) แทนหน้าโหลดโลโก้หมุนเดิม · พื้นหลังหน้าแรกภาพสีน้ำ (campus-backdrop.js)
      · อนิเมชันตอนเลื่อน (scroll-fx.js) · ปุ่มโลหะเหลว (metal-button.js) · โมเดลหน้าแรกเอียงตามเมาส์ (hero-motion.js)
      · ข่าวล่าสุด/แถบสาขา/แกลเลอรีเปลี่ยนเอง (alive.js)
      - ข้ามฉากเข้าเว็บอัตโนมัติเมื่อ: เปิด Reduced Motion, URL มี #anchor, มี ?noloader
        หรือกดลิงก์กลับมาจากหน้าอื่นในเว็บเดียวกัน (รีโหลดหน้ายังเห็นฉากเข้าเว็บ แต่เร็วขึ้น · บังคับแสดงด้วย ?loader)
      - ถ้า scroll-fx.js โหลดไม่สำเร็จ เว็บจะกลับไปใช้อนิเมชันเดิมที่มากับ app.js เอง
      - v9.2: motion.css (เปลี่ยนหน้า / เปลี่ยนโหมด / เมนู) · doc-links.js (เอกสารที่ไม่มีในชุด เปิดต้นฉบับออนไลน์แทน)
    -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add("js");
        window.__LVC_FX = 1;
        // v9.3: เข้าหน้าแรกไม่ใช้การจางเปลี่ยนหน้า หน้าแรกสร้างเนื้อหาด้วย JS และมีการเปิดตัวของตัวเอง
        // (Safari จะเล่นการเปิดตัวซ้ำเมื่อการเปลี่ยนหน้าจบ)
        window.addEventListener("pagereveal", function (e) {
          var vt = e.viewTransition;
          if (!vt) return;
          var quiet = function () {};
          if (vt.ready) vt.ready.catch(quiet);
          if (vt.finished) vt.finished.catch(quiet);
          if (vt.updateCallbackDone) vt.updateCallbackDone.catch(quiet);
          try { vt.skipTransition(); } catch (_) {}
        }, { once: true });
        try {
          var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
          // กลับมาหน้าแรกจากหน้าอื่นในเว็บเดียวกัน (ไม่ใช่การรีโหลด) ไม่ต้องดูหน้าโหลดซ้ำ
          var entry = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
          var reload = entry ? entry.type === "reload" : !!(performance.navigation && performance.navigation.type === 1);
          var internal = false;
          try { internal = !!document.referrer && new URL(document.referrer).origin === location.origin && !reload; } catch (e) {}
          var skip = reduce || internal || location.hash.length > 1 || /[?&]noloader(=|&|$)/.test(location.search);
          if (!reduce && /[?&]loader(=|&|$)/.test(location.search)) skip = false;
          if (skip) {
            // เข้าหน้าแรกโดยไม่มีหน้าโหลด: หัวข้อและเมนูเปิดตัวสั้น ๆ แทน (motion.css)
            if (!reduce && location.hash.length < 2) {
              d.classList.add("lvc-return");
              setTimeout(function () { d.classList.remove("lvc-return"); }, 2600);
            }
            return;
          }
          d.classList.add("lvc-loading");
          if ("scrollRestoration" in history) {
            window.__LVC_PREV_SCROLL_RESTORATION = history.scrollRestoration;
            history.scrollRestoration = "manual";
          }
          window.scrollTo(0, 0);
          // กันพลาด: เข้าเว็บได้ภายในราว 15 วินาทีเสมอ
          //   ฉากยังเล่นอยู่ (เน็ต/เครื่องช้า) → สั่งข้ามแบบนุ่มนวล · สคริปต์ฉากไม่ทำงาน/ค้าง → ปิดม่านทันที
          var slow = 1 / Math.min(1, window.__LVC_INTRO_SPEED || 1);
          var hard = function () {
            if (window.__LVC_LOADER_DONE) return;
            try { if (window.__LVC_SKIP_LOADER) window.__LVC_SKIP_LOADER(); } catch (e) {}
            if (window.__LVC_LOADER_DONE) return;
            window.__LVC_LOADER_DONE = true;
            d.classList.remove("lvc-loading");
            var l = document.getElementById("lvc-intro"); if (l) l.remove();
            var a = document.getElementById("app"); if (a) a.inert = false;
            if ("scrollRestoration" in history) {
              var restore = window.__LVC_PREV_SCROLL_RESTORATION || "auto";
              history.scrollRestoration = restore;
              if (window.__LVC && window.__LVC.ScrollTrigger) window.__LVC.ScrollTrigger.clearScrollMemory(restore);
            }
            window.dispatchEvent(new CustomEvent("lvc:loaded"));
          };
          setTimeout(function () {
            if (window.__LVC_LOADER_DONE) return;
            var L = window.__LVC_LOADER;
            if (L && (L.auto || L.skip)) {
              try { (L.auto || L.skip)(); } catch (e) {}
              setTimeout(hard, 3000 * slow);
              return;
            }
            hard();
          }, 15000 * slow);
        } catch (e) {}
      })();
    </script>
