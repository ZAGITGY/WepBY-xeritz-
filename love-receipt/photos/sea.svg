<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450">
  <title>ทะเลยามเช้า พระอาทิตย์โผล่ครึ่งดวง รอยเท้าสองคู่บนหาด</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7efe1"/>
      <stop offset="1" stop-color="#f2d2ac"/>
    </linearGradient>
    <clipPath id="above"><rect width="600" height="236"/></clipPath>
  </defs>
  <rect width="600" height="450" fill="url(#sky)"/>
  <!-- พระอาทิตย์ -->
  <g clip-path="url(#above)">
    <circle cx="300" cy="236" r="78" fill="#efa95e"/>
    <circle cx="300" cy="236" r="54" fill="#f5c27f"/>
  </g>
  <g stroke="#e3a663" stroke-width="7" stroke-linecap="round">
    <path d="M300 128 V104"/><path d="M226 158 L210 140"/><path d="M374 158 L390 140"/>
    <path d="M190 214 H164"/><path d="M410 214 H436"/>
  </g>
  <!-- นก -->
  <path d="M120 92 q14 -14 24 0 q10 -14 24 0" fill="none" stroke="#3a312b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M168 66 q10 -10 17 0 q7 -10 17 0" fill="none" stroke="#3a312b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ทะเล -->
