    <ellipse cx="200" cy="412" rx="9" ry="14" transform="rotate(-18 200 412)"/>
    <ellipse cx="214" cy="388" rx="8" ry="12" transform="rotate(-18 214 388)"/>
    <ellipse cx="242" cy="370" rx="7" ry="11" transform="rotate(-18 242 370)"/>
    <ellipse cx="226" cy="440" rx="8" ry="12" transform="rotate(-24 226 440)"/>
    <ellipse cx="252" cy="420" rx="8" ry="12" transform="rotate(-24 252 420)"/>
    <ellipse cx="262" cy="398" rx="7" ry="11" transform="rotate(-24 262 398)"/>
    <ellipse cx="286" cy="382" rx="6" ry="10" transform="rotate(-24 286 382)"/>
  </g>
  <!-- ร่มชายหาด -->
  <path d="M470 446 L500 300" stroke="#3a312b" stroke-width="6" stroke-linecap="round"/>
  <path d="M420 300 Q500 228 584 316 Z" fill="#c4554d" stroke="#3a312b" stroke-width="5" stroke-linejoin="round"/>
  <path d="M500 268 L470 306 M500 268 L530 312" stroke="#fbf8f2" stroke-width="10"/>
  <path d="M420 300 Q500 228 584 316 Z" fill="none" stroke="#3a312b" stroke-width="5" stroke-linejoin="round"/>
