  <!-- คลื่นกับหาด -->
  <path d="M0 340 C80 324 140 352 220 338 C300 324 380 356 460 340 C520 330 560 342 600 336 V450 H0 Z" fill="#fbf8f2"/>
  <path d="M0 352 C90 338 150 364 230 352 C310 340 390 368 470 354 C530 344 570 356 600 350 V450 H0 Z" fill="#ead3ac"/>
